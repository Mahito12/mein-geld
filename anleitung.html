<style>
:root{--bg:#f8f4ff;--ink:#2d2640;--ink2:#625a78;--line:#e6def5;--accent:#8b6cf6;--accent2:#f06aa6;--neg:#d6336c;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:var(--ink);display:flex;align-items:center;justify-content:center;padding:24px 16px;
  background:radial-gradient(420px 320px at 0% 0%,#ffe0ef 0%,transparent 70%),radial-gradient(380px 300px at 100% 10%,#e3dcff 0%,transparent 70%),radial-gradient(420px 360px at 50% 100%,#d8f7ea 0%,transparent 70%),var(--bg)}
form{width:100%;max-width:340px;text-align:center}
img{width:76px;height:76px;border-radius:22px;box-shadow:0 12px 28px -10px rgba(240,106,166,.6)}
h1{font-size:24px;font-weight:900;margin:14px 0 4px}
p{margin:0 0 20px;color:var(--ink2);font-weight:600}
input{width:100%;padding:15px 16px;border-radius:18px;border:2px solid var(--line);background:#fff;font:inherit;font-size:17px;font-weight:700;outline:0;text-align:center}
input:focus{border-color:#c9b8ff}
button{width:100%;margin-top:12px;padding:15px;border:0;border-radius:18px;font:inherit;font-size:17px;font-weight:900;color:#fff;cursor:pointer;
  background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 8px 20px -8px rgba(240,106,166,.6)}
button:disabled{opacity:.6}
#msg{min-height:22px;margin-top:12px;font-weight:700;font-size:14px;color:var(--ink2)}
#msg.err{color:var(--neg)}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
[hidden]{display:none}
</style>
</head>

  const REMEMBER = 'meinGeld.zugang.' + P.salt;
  const te = new TextEncoder(), td = new TextDecoder();
  const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const b64 = a => btoa(String.fromCharCode.apply(null, a));

  async function open(rawKey){
    const key = await crypto.subtle.importKey('raw', rawKey, 'AES-GCM', false, ['decrypt']);
    const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:unb64(P.iv)}, key, unb64(P.data));
    return td.decode(pt);
  }
  // Seite erst ersetzen, wenn sie fertig geladen ist – sonst hängt der Browser den Inhalt nur an
  async function show(html){
    if(document.readyState !== 'complete') await new Promise(r => window.addEventListener('load', r, {once:true}));
    document.open(); document.write(html); document.close();
  }
  async function fromPassword(pw){
    const base = await crypto.subtle.importKey('raw', te.encode(pw), 'PBKDF2', false, ['deriveBits']);
    const bits = await crypto.subtle.deriveBits({name:'PBKDF2', salt:unb64(P.salt), iterations:P.iter, hash:'SHA-256'}, base, 256);
    return new Uint8Array(bits);
  }

  const f = document.getElementById('f'), pw = document.getElementById('pw'), go = document.getElementById('go'), msg = document.getElementById('msg');

  if(!(window.crypto && crypto.subtle)){
    document.body.textContent = 'Bitte öffne die App über ihre https-Adresse.';
    return;
  }

  (async () => {
    // Auf diesem Gerät schon freigeschaltet? Dann direkt öffnen.
    let saved = null;
    try{ saved = localStorage.getItem(REMEMBER); }catch(e){}
    if(saved){
      try{ const html = await open(unb64(saved)); await show(html); return; }
      catch(e){ try{ localStorage.removeItem(REMEMBER); }catch(_){} }
    }
    f.hidden = false;
    pw.focus();
  })();

  f.addEventListener('submit', async e => {
    e.preventDefault();
    if(!pw.value) return;
    go.disabled = true; msg.className = ''; msg.textContent = 'Einen Moment …';
    try{
      const raw = await fromPassword(pw.value);
      const html = await open(raw);
      try{ localStorage.setItem(REMEMBER, b64(raw)); }catch(_){}
      await show(html);
    }catch(err){
      go.disabled = false;
      msg.className = 'err'; msg.textContent = 'Falsches Passwort';
      f.classList.remove('shake'); void f.offsetWidth; f.classList.add('shake');
      pw.select();
    }
  });
})();
</script>
